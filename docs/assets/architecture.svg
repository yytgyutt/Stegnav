<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">STEGNav HomeGraph architecture</title>
  <desc id="desc">A task query selects relevant HomeGraph entities and exploration frontiers, then a policy executes, verifies, remembers and writes confirmed discoveries back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#0b3444"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3fc7da"/><stop offset="1" stop-color="#70e7ba"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001018" flood-opacity=".45"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59d7d8"/></marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#effcff}.sub{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#9db8c4}.h{font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#eafcff}.p{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#a8c1cb}.mini{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#79dfe1;letter-spacing:1.4px}.edge{fill:none;stroke:#59d7d8;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" rx="26" fill="url(#bg)"/>
  <text x="70" y="72" class="title">From a fixed HomeGraph to a task-conditioned exploration loop</text>
  <text x="70" y="106" class="sub">Stable world knowledge remains the source of truth; a dynamic layer selects, explores, verifies and learns.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="260" height="420" rx="22" fill="#0d2637" stroke="#2c6d82"/>
    <rect x="94" y="194" width="212" height="54" rx="14" fill="#12394c"/>
    <text x="200" y="217" text-anchor="middle" class="mini">STABLE WORLD MODEL</text>
    <text x="200" y="239" text-anchor="middle" class="h">HomeGraph</text>
    <g stroke="#397f90" stroke-width="2" stroke-dasharray="5 6">
      <path d="M132 322L200 288L270 328L199 377L125 423L267 468"/>
      <path d="M200 288L199 377L267 468M270 328L199 377L125 423"/>
    </g>
    <g fill="#0b1d2a" stroke="#5ed9db" stroke-width="3">
      <circle cx="200" cy="288" r="12"/><circle cx="132" cy="322" r="12"/><circle cx="270" cy="328" r="12"/><circle cx="199" cy="377" r="15"/><circle cx="125" cy="423" r="12"/><circle cx="267" cy="468" r="12"/>
    </g>
    <text x="200" y="532" text-anchor="middle" class="p">rooms · objects · doors</text>
    <text x="200" y="557" text-anchor="middle" class="p">poses · affordances · topology</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="422" y="146" width="470" height="196" rx="22" fill="#0d2637" stroke="#2c6d82"/>
    <text x="450" y="184" class="mini">CURRENT TASK</text>
    <rect x="450" y="204" width="414" height="52" rx="14" fill="#102f41" stroke="#3a8797"/>
    <text x="472" y="236" class="h">“Find the lamp in the study”</text>
    <rect x="450" y="276" width="196" height="42" rx="12" fill="#12394c"/>
    <text x="548" y="302" text-anchor="middle" class="p">Query grounding</text>
    <rect x="668" y="276" width="196" height="42" rx="12" fill="#12394c"/>
    <text x="766" y="302" text-anchor="middle" class="p">Relevant subgraph</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="422" y="394" width="470" height="196" rx="22" fill="#0d2637" stroke="#2c6d82"/>
    <text x="450" y="432" class="mini">UNKNOWN SPACE</text>
    <text x="450" y="468" class="h">Frontier grounding</text>
    <text x="450" y="498" class="p">reachability + information gain + semantic hints</text>
    <g transform="translate(680 460)">
      <path d="M0 80C42 2 93 4 158 30" fill="none" stroke="#3a8797" stroke-width="3" stroke-dasharray="7 6"/>
      <circle cx="0" cy="80" r="12" fill="#0b1d2a" stroke="#5ed9db" stroke-width="3"/>
      <circle cx="80" cy="28" r="12" fill="#0b1d2a" stroke="#5ed9db" stroke-width="3"/>
      <path d="M158 14L181 30L158 46Z" fill="#79e7b7"/>
      <text x="117" y="76" class="p">frontier</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="994" y="170" width="336" height="420" rx="22" fill="#0d2637" stroke="#2c6d82"/>
    <text x="1022" y="208" class="mini">CLOSED LOOP</text>
    <g>
      <rect x="1022" y="234" width="280" height="52" rx="14" fill="#12394c"/><text x="1162" y="267" text-anchor="middle" class="h">1 · Select</text>
      <rect x="1022" y="308" width="280" height="52" rx="14" fill="#12394c"/><text x="1162" y="341" text-anchor="middle" class="h">2 · Navigate / Observe</text>
      <rect x="1022" y="382" width="280" height="52" rx="14" fill="#12394c"/><text x="1162" y="415" text-anchor="middle" class="h">3 · Verify</text>
      <rect x="1022" y="456" width="280" height="52" rx="14" fill="#12394c"/><text x="1162" y="489" text-anchor="middle" class="h">4 · Remember</text>
      <rect x="1022" y="530" width="280" height="40" rx="12" fill="url(#cyan)"/><text x="1162" y="556" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750" fill="#062131">CONFIRMED → WRITE BACK</text>
    </g>
  </g>

  <path d="M330 250C370 250 382 220 422 220" class="edge"/>
  <path d="M330 440C370 440 382 492 422 492" class="edge"/>
  <path d="M892 244C942 244 950 260 994 260" class="edge"/>
  <path d="M892 492C942 492 950 334 994 334" class="edge"/>
  <path d="M1162 590C1162 680 200 680 200 590" class="edge"/>
  <text x="687" y="700" text-anchor="middle" class="mini">VERIFIED DISCOVERIES ENRICH THE LONG-TERM GRAPH</text>
</svg>
