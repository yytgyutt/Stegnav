<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc">
  <title id="title">HomeGraph and task-conditioned graph comparison</title>
  <desc id="desc">The left shows a complete fixed graph; the right shows a smaller task-relevant graph enriched by frontiers and event memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fafc"/><stop offset="1" stop-color="#e8f4f4"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#158da2"/></marker>
    <style>
      .title{font:700 32px Inter,Segoe UI,Arial,sans-serif;fill:#102b3a}.h{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#123447}.p{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#4c6875}.tag{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#147d8e;letter-spacing:1.3px}.line{stroke:#77a6b1;stroke-width:2;stroke-dasharray:6 6}.hot{stroke:#159caf;stroke-width:4}.node{fill:#fff;stroke:#5c8995;stroke-width:3}.focus{fill:#e0fcf2;stroke:#14a89e;stroke-width:4}.unknown{fill:#ffe9a8;stroke:#d58f12;stroke-width:4}
    </style>
  </defs>
  <rect width="1400" height="690" rx="26" fill="url(#bg)"/>
  <text x="70" y="66" class="title">Same home, different graph for the decision</text>
  <text x="70" y="98" class="p">HomeGraph stores the whole world. The dynamic layer keeps only what matters now, plus where to explore next.</text>

  <rect x="70" y="142" width="575" height="470" rx="24" fill="#ffffff" stroke="#c8dce1"/>
  <text x="105" y="185" class="tag">FIXED WORLD MODEL</text>
  <text x="105" y="220" class="h">Complete HomeGraph</text>
  <text x="105" y="248" class="p">Stable, editable and comprehensive — but every task sees the same graph.</text>
  <g transform="translate(126 285)">
    <g class="line" fill="none">
      <path d="M45 60L160 30L275 70L390 28L475 105L375 180L470 267L310 300L190 240L65 285L45 60"/>
      <path d="M160 30L190 240M275 70L375 180M45 60L375 180M390 28L190 240M475 105L310 300M65 285L275 70"/>
    </g>
    <g class="node">
      <circle cx="45" cy="60" r="15"/><circle cx="160" cy="30" r="15"/><circle cx="275" cy="70" r="15"/><circle cx="390" cy="28" r="15"/><circle cx="475" cy="105" r="15"/><circle cx="375" cy="180" r="15"/><circle cx="470" cy="267" r="15"/><circle cx="310" cy="300" r="15"/><circle cx="190" cy="240" r="15"/><circle cx="65" cy="285" r="15"/>
    </g>
    <g class="p" text-anchor="middle"><text x="45" y="94">room</text><text x="160" y="5">door</text><text x="275" y="104">lamp</text><text x="390" y="4">switch</text><text x="475" y="139">sofa</text><text x="375" y="214">table</text><text x="470" y="301">bed</text><text x="310" y="334">chair</text><text x="190" y="274">portal</text><text x="65" y="319">anchor</text></g>
  </g>

  <rect x="755" y="142" width="575" height="470" rx="24" fill="#ffffff" stroke="#74cbd0" stroke-width="2"/>
  <text x="790" y="185" class="tag">TASK-CONDITIONED LAYER</text>
  <text x="790" y="220" class="h">“Find the study lamp”</text>
  <text x="790" y="248" class="p">Relevant entities, candidate frontiers and recent evidence are assembled on demand.</text>
  <g transform="translate(815 306)">
    <path d="M70 85L205 45L340 110L455 62" fill="none" class="hot" marker-end="url(#arrow)"/>
    <path d="M205 45L235 235L340 110" fill="none" class="line"/>
    <circle cx="70" cy="85" r="24" class="node"/><circle cx="205" cy="45" r="24" class="focus"/><circle cx="340" cy="110" r="24" class="focus"/><path d="M455 34L481 62L455 90L429 62Z" class="unknown"/>
    <circle cx="235" cy="235" r="24" fill="#e8e6ff" stroke="#7466c7" stroke-width="4"/>
    <g text-anchor="middle"><text x="70" y="90" class="h" font-size="15">Q</text><text x="205" y="50" class="h" font-size="15">room</text><text x="340" y="115" class="h" font-size="15">lamp</text><text x="455" y="67" class="h" font-size="14">?</text><text x="235" y="240" class="h" font-size="14">event</text></g>
    <g class="p" text-anchor="middle"><text x="70" y="130">query</text><text x="205" y="5">study</text><text x="340" y="155">known clue</text><text x="455" y="112">frontier</text><text x="235" y="280">verified memory</text></g>
  </g>
  <rect x="795" y="562" width="495" height="34" rx="17" fill="#e4f7f4"/>
  <text x="1042" y="584" text-anchor="middle" class="p">smaller context · explicit uncertainty · exploration ready</text>
</svg>
