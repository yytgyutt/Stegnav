<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">STEGNav and HomeGraph reproduction banner</title>
  <desc id="desc">A home scene graph evolves into a task-conditioned exploration graph with memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071726"/>
      <stop offset="0.55" stop-color="#0b2840"/>
      <stop offset="1" stop-color="#0b3d4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5de2e7"/>
      <stop offset="1" stop-color="#88f0b4"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#4bb4c2" stroke-opacity=".10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#5de2e7"/>
    </marker>
  </defs>
  <rect width="1400" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="1190" cy="55" r="240" fill="#24b8c8" opacity=".08"/>
  <circle cx="1040" cy="470" r="250" fill="#5ee7ad" opacity=".06"/>

  <g transform="translate(88 76)">
    <text x="0" y="48" fill="#7be6ea" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">UNOFFICIAL REPRODUCTION</text>
    <text x="0" y="130" fill="#f4fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="750">STEGNav × HomeGraph</text>
    <text x="0" y="182" fill="#aec8d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">Task-conditioned scene graphs for exploration, memory and navigation</text>
    <rect x="0" y="226" width="204" height="44" rx="22" fill="#123b51" stroke="#46cbd2"/>
    <text x="102" y="255" text-anchor="middle" fill="#c8f8f6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">QUERY GROUNDING</text>
    <rect x="220" y="226" width="204" height="44" rx="22" fill="#123b51" stroke="#46cbd2"/>
    <text x="322" y="255" text-anchor="middle" fill="#c8f8f6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">FRONTIER SEARCH</text>
    <rect x="440" y="226" width="204" height="44" rx="22" fill="#123b51" stroke="#46cbd2"/>
    <text x="542" y="255" text-anchor="middle" fill="#c8f8f6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">EVENT MEMORY</text>
    <text x="0" y="340" fill="#7f9dab" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Paper-inspired engineering scaffold · Python 3.8+ · MIT License</text>
  </g>

  <g transform="translate(910 98)">
    <path d="M20 72L165 22L326 84L301 285L139 346L-4 252Z" fill="#0d2436" stroke="#2b7c93" stroke-width="2"/>
    <path d="M20 72L139 176L165 22M139 176L326 84M139 176L139 346M139 176L301 285M-4 252L139 176" fill="none" stroke="#387f92" stroke-width="2" stroke-dasharray="7 8"/>
    <path d="M165 22C214 83 257 111 326 84M139 176C204 216 243 251 301 285" fill="none" stroke="#5de2e7" stroke-width="3" marker-end="url(#arrow)"/>
    <g fill="#071726" stroke="#5de2e7" stroke-width="4" filter="url(#glow)">
      <circle cx="20" cy="72" r="12"/><circle cx="165" cy="22" r="12"/><circle cx="326" cy="84" r="12"/>
      <circle cx="139" cy="176" r="17"/><circle cx="-4" cy="252" r="12"/><circle cx="301" cy="285" r="12"/><circle cx="139" cy="346" r="12"/>
    </g>
    <g fill="#d9f9f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">
      <text x="-4" y="49">ROOM</text><text x="144" y="-4">OBJECT</text><text x="301" y="61">FRONTIER</text>
      <text x="112" y="211">TASK</text><text x="-34" y="286">POSE</text><text x="283" y="319">EVENT</text><text x="113" y="380">MEMORY</text>
    </g>
  </g>
</svg>
