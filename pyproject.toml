[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stegnav-homegraph-reproduction"
version = "0.1.0"
description = "Unofficial paper-inspired STEGNav reproduction scaffold for HomeGraph"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "HomeGraph Reproduction Contributors"}]
keywords = ["robotics", "navigation", "scene-graph", "homegraph", "embodied-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stegnav-demo = "stegnav_reproduction.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
